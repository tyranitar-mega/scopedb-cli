name: Verify staging workload identity
description: Build scope, exchange the job's OIDC token on staging, and run data-plane checks.

runs:
  using: composite
  steps:
    - name: Configure ScopeDB home
      shell: bash
      run: echo "SCOPEDB_HOME=$RUNNER_TEMP/scopedb" >> "$GITHUB_ENV"

    - name: Build scope
      shell: bash
      run: mise run build

    - name: Print OIDC claims
      shell: bash
      run: |
        echo "SCOPEDB_CONTROL_URL=$SCOPEDB_CONTROL_URL"
        echo "SCOPEDB_WORKSPACE_ID=$SCOPEDB_WORKSPACE_ID"
        token="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$SCOPEDB_CONTROL_URL" | jq -r .value)"
        python3 -c 'import sys, base64, json
        payload = sys.argv[1].split(".")[1]
        payload += "=" * (-len(payload) % 4)
        claims = json.loads(base64.urlsafe_b64decode(payload))
        keep = ("iss", "aud", "sub", "ref", "environment", "repository", "actor")
        print(json.dumps({k: claims[k] for k in keep if k in claims}, indent=2))' "$token"

    - name: Log in with workload identity
      shell: bash
      run: ./bin/scope auth login --workload-identity --workspace "$SCOPEDB_WORKSPACE_ID" --insecure-storage

    - name: Verify data-plane access
      shell: bash
      run: |
        ./bin/scope catalog list databases
        ./bin/scope query 'SELECT 1 AS ready'
