name: Staging workload identity

on:
  workflow_dispatch:
  push:
    branches: [ test/workload-identity-staging ]
    tags: [ 'ci-*' ]
  pull_request:

permissions:
  contents: read

jobs:
  environment:
    name: Workload identity login (environment context)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      SCOPEDB_CONTROL_URL: ${{ vars.SCOPEDB_CONTROL_URL }}
      SCOPEDB_WORKSPACE_ID: ${{ vars.SCOPEDB_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - name: Verify workload identity
        uses: ./.github/actions/staging-workload-verify

  branch:
    name: Workload identity login (branch context)
    # ref_type is also 'branch' for pull_request merge refs, where every job token
    # carries :pull_request; only push/dispatch produce a real branch subject.
    if: github.ref_type == 'branch' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SCOPEDB_CONTROL_URL: ${{ vars.SCOPEDB_CONTROL_URL }}
      SCOPEDB_WORKSPACE_ID: ${{ vars.SCOPEDB_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - name: Verify workload identity
        uses: ./.github/actions/staging-workload-verify

  tag:
    name: Workload identity login (tag context)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SCOPEDB_CONTROL_URL: ${{ vars.SCOPEDB_CONTROL_URL }}
      SCOPEDB_WORKSPACE_ID: ${{ vars.SCOPEDB_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - name: Verify workload identity
        uses: ./.github/actions/staging-workload-verify

  pull-request:
    name: Workload identity login (pull request context)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SCOPEDB_CONTROL_URL: ${{ vars.SCOPEDB_CONTROL_URL }}
      SCOPEDB_WORKSPACE_ID: ${{ vars.SCOPEDB_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - name: Verify workload identity
        uses: ./.github/actions/staging-workload-verify
