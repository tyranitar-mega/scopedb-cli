name: Staging workload identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workload-login:
    name: Workload identity login on staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      SCOPEDB_CONTROL_URL: ${{ vars.SCOPEDB_CONTROL_URL }}
      SCOPEDB_WORKSPACE_ID: ${{ vars.SCOPEDB_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup Go cache
        uses: ./.github/actions/setup-go-cache

      - name: Build scope
        run: mise run build

      - name: Configure ScopeDB home
        run: echo "SCOPEDB_HOME=$RUNNER_TEMP/scopedb" >> "$GITHUB_ENV"

      - name: Log in with workload identity
        run: ./bin/scope auth login --workload-identity --workspace "$SCOPEDB_WORKSPACE_ID" --insecure-storage

      - name: Verify data-plane access
        run: |
          ./bin/scope catalog list
          ./bin/scope query 'SELECT 1 AS ready'
